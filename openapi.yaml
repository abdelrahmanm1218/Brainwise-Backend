components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        API Key authentication. Format: `token <api_key>:<api_secret>`
        Example: `Authorization: token abc123:secret456`
    CookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: Session cookie from web login

  schemas:
    LoginRequest:
      type: object
      description: Login credentials
      required:
        - usr
        - pwd
      properties:
        usr:
          type: string
          description: Username or email address
          example: "administrator@example.com"
        pwd:
          type: string
          format: password
          description: User password
          example: "your_password"
      additionalProperties: false

    LoginSuccessResponse:
      type: object
      description: Successful login response
      properties:
        message:
          type: object
          properties:
            success:
              type: boolean
              description: Indicates successful authentication
              example: true
            message:
              type: string
              description: Success message
              example: "Authentication Success"
            sid:
              type: string
              description: Session ID for subsequent authenticated requests
              example: "abc123def456789"
          required:
            - success
            - message
            - sid

    LoginErrorResponse:
      type: object
      description: Failed login response
      properties:
        message:
          type: object
          properties:
            success:
              type: boolean
              description: Indicates failed authentication
              example: false
            message:
              type: string
              description: Error message
              example: "Authentication Failed"
          required:
            - success
            - message

    AccountResponse:
      type: object
      description: User account information
      properties:
        name:
          type: string
          description: User ID (email or username)
          example: "administrator@example.com"
        creation:
          type: string
          format: date-time
          description: Account creation timestamp
          example: "2024-01-01 10:00:00"
        first_name:
          type: string
          description: User's first name
          example: "John"
        middle_name:
          type: string
          description: User's middle name
          nullable: true
          example: ""
        last_name:
          type: string
          description: User's last name
          example: "Doe"
        full_name:
          type: string
          description: User's full name (first + middle + last)
          example: "John Doe"
        username:
          type: string
          description: Username
          example: "administrator"
        roles:
          type: array
          description: List of roles assigned to the user
          items:
            type: string
          example:
            - "System Manager"
            - "BWAdmin"
        mobile_no:
          type: string
          description: Mobile phone number
          nullable: true
          example: "+1-555-123-4567"
        gender:
          type: string
          description: User's gender
          nullable: true
          enum:
            - Male
            - Female
            - Other
          example: "Male"
        birth_date:
          type: string
          format: date
          description: Date of birth
          nullable: true
          example: "1990-01-15"
        user_image:
          type: string
          description: URL or path to user's profile image
          nullable: true
          example: "/files/user_image.jpg"
        language:
          type: string
          description: Preferred language code
          nullable: true
          example: "en"
        time_zone:
          type: string
          description: User's time zone
          nullable: true
          example: "America/New_York"
        location:
          type: string
          description: User's location
          nullable: true
          example: "New York, USA"
      required:
        - name
        - creation
        - first_name
        - last_name
        - full_name
        - username
        - roles

    UpdateProfileRequest:
      type: object
      description: Profile update request - all fields are optional
      properties:
        first_name:
          type: string
          description: User's first name
          example: "John"
        middle_name:
          type: string
          description: User's middle name
          nullable: true
          example: ""
        last_name:
          type: string
          description: User's last name
          example: "Doe"
        mobile_no:
          type: string
          description: Mobile phone number
          nullable: true
          example: "+1-555-123-4567"
        gender:
          type: string
          description: User's gender
          nullable: true
          enum:
            - Male
            - Female
            - Other
          example: "Male"
        birth_date:
          type: string
          format: date
          description: Date of birth
