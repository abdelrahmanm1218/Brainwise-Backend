openapi: 3.0.3
info:
  title: Employee Management API
  description: |
    API documentation for the Employee Management application.
    
    This API provides endpoints for managing companies, departments, and employees.
    
    ## Authentication
    Most API requests require authentication using either:
    - **Session Cookie**: Use the `/method/employee_management.auth.login` endpoint to authenticate and receive a session ID (sid). The session cookie is automatically set and can be used for subsequent requests.
    - **API Key**: Include `Authorization: token <api_key>:<api_secret>` header for programmatic access
    
    ## Login
    To authenticate, make a POST request to `/method/employee_management.auth.login` with your username and password. 
    On success, you'll receive a session ID (sid) that can be used for authenticated requests.
    
    ## Base URL
    The base URL for all endpoints is: `https://your-site.com/api`
    
  version: 1.0.0
  contact:
    name: Employee Management API Support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  # - url: https://your-site.com/api
  #   description: Production server
  - url: http://brain.localhost:8013/api
    description: Local development server

tags:
  - name: Authentication
    description: Authentication and session management
  - name: Companies
    description: Operations related to companies
  - name: Departments
    description: Operations related to departments
  - name: Employees
    description: Operations related to employees

paths:
  # ============================================
  # AUTHENTICATION ENDPOINTS
  # ============================================
  /method/employee_management.auth.login:
    post:
      tags:
        - Authentication
      summary: User login
      description: |
        Authenticate a user with username and password.
        
        On successful authentication, a session ID (sid) is returned which can be used
        for subsequent API requests via session cookie authentication.
        
        **Note:** This endpoint does not require authentication (allow_guest=True).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              usr: "administrator@example.com"
              pwd: "your_password"
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: Session cookie (sid) is set automatically
              schema:
                type: string
                example: "sid=abc123def456; Path=/; HttpOnly"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
              example:
                message:
                  success: true
                  message: "Authentication Success"
                  sid: "abc123def456789"
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginErrorResponse'
              example:
                message:
                  success: false
                  message: "Authentication Failed"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /method/employee_management.auth.account:
    get:
      tags:
        - Authentication
      summary: Get current user account information
      description: |
        Retrieve the account information for the currently authenticated user.
        
        Returns user details including name, roles, contact information, and preferences.
        
        **Note:** This endpoint requires authentication. The user must be logged in.
      operationId: getAccount
      responses:
        '200':
          description: Account information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              example:
                name: "administrator@example.com"
                creation: "2024-01-01 10:00:00"
                first_name: "John"
                middle_name: ""
                last_name: "Doe"
                full_name: "John Doe"
                username: "administrator"
                roles:
                  - "System Manager"
                  - "BWAdmin"
                mobile_no: "+1-555-123-4567"
                gender: "Male"
                birth_date: "1990-01-15"
                user_image: "/files/user_image.jpg"
                language: "en"
                time_zone: "America/New_York"
                location: "New York, USA"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                exc_type: "DoesNotExistError"
                exc: "User not found."
                _server_messages: []
        '500':
          $ref: '#/components/responses/InternalServerError'

  /method/employee_management.auth.update_profile:
    post:
      tags:
        - Authentication
      summary: Update current user profile
      description: |
        Update profile information for the currently authenticated user.
        
        All fields are optional - only include the fields you want to update.
        The function will only update fields that are provided in the request.
        
        **Note:** This endpoint requires authentication. The user must be logged in.
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              first_name: "John"
              last_name: "Doe"
              mobile_no: "+1-555-123-4567"
              gender: "Male"
              birth_date: "1990-01-15"
              language: "en"
              time_zone: "America/New_York"
              location: "New York, USA"
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfileResponse'
              example:
                message:
                  success: 1
                  message: "Profile updated successfully"
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfileResponse'
              example:
                message:
                  success: 0
                  message: "Failed to update profile: Validation error"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================
  # COMPANY ENDPOINTS
  # ============================================
  /resource/BWCompany:
    get:
      tags:
        - Companies
      summary: List all companies
      description: Retrieve a list of all companies with optional filtering and pagination
      operationId: listCompanies
      parameters:
        - name: fields
          in: query
          description: Comma-separated list of fields to include in response
          required: false
          schema:
            type: string
            example: "name,company_name,number_of_departments,number_of_employees"
        - name: filters
          in: query
          description: JSON string for filtering results
          required: false
          schema:
            type: string
            example: '{"company_name": "Acme Corp"}'
        - name: limit_start
          in: query
          description: Starting index for pagination (0-based)
          required: false
          schema:
            type: integer
            default: 0
        - name: limit_page_length
          in: query
          description: Number of records per page
          required: false
          schema:
            type: integer
            default: 20
        - name: order_by
          in: query
          description: Field to order by (e.g., "modified desc")
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BWCompany'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags:
        - Companies
      summary: Create a new company
      description: Create a new company record
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BWCompanyCreate'
      responses:
        '200':
          description: Company created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BWCompany'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /resource/BWCompany/{name}:
    get:
      tags:
        - Companies
      summary: Get a specific company
      description: Retrieve details of a specific company by name
      operationId: getCompany
      parameters:
        - name: name
          in: path
          required: true
          description: The name (ID) of the company
          schema:
            type: string
        - name: fields
          in: query
          description: Comma-separated list of fields to include in response
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BWCompany'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    
    put:
      tags:
        - Companies
      summary: Update a company
      description: Update an existing company record
      operationId: updateCompany
      parameters:
        - name: name
          in: path
          required: true
          description: The name (ID) of the company
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BWCompanyUpdate'
      responses:
        '200':
          description: Company updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BWCompany'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    
    delete:
      tags:
        - Companies
      summary: Delete a company
      description: Delete a company record
      operationId: deleteCompany
      parameters:
        - name: name
          in: path
          required: true
          description: The name (ID) of the company
          schema:
            type: string
      responses:
        '200':
          description: Company deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "ok"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

